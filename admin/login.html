<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/logo/logo.png" type="image/png">
<title>Admin sign in — NeoFragrances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="nf-admin" data-catalog="off">

<div class="adm-login">
  <aside class="adm-login-brand">
    <a class="adm-brand" href="../index.html" aria-label="NeoFragrances store"><span class="adm-brand-mark">Neo</span><span class="adm-brand-word">Fragrances</span><span class="adm-brand-tag">Admin</span></a>
    <div>
      <h2>Store operations</h2>
      <p>Manage products, stock, offers, orders, customers and reviews for NeoFragrances.</p>
    </div>
    <span class="adm-note" style="color:rgba(250,246,240,0.5)">Authorised staff only.</span>
  </aside>

  <main class="adm-login-panel" id="adm-main">
    <div class="adm-login-card">
      <h1>Sign in</h1>
      <p>Use your administrator account.</p>
      <p class="adm-login-notice" id="login-notice" role="status" hidden></p>
      <form id="admin-login-form" novalidate>
        <div class="adm-field">
          <label for="admin-email">Email address</label>
          <input class="adm-input" type="email" id="admin-email" autocomplete="username" required>
        </div>
        <div class="adm-field">
          <label for="admin-password">Password</label>
          <div class="adm-pw">
            <input class="adm-input" type="password" id="admin-password" autocomplete="current-password" required>
            <button type="button" id="toggle-pw" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <button type="submit" class="adm-btn adm-btn--primary">Sign in</button>
        <p class="adm-login-msg" id="admin-login-msg" role="alert"></p>
      </form>
      <div class="adm-login-links">
        <a href="../forgot-password.html">Forgot password?</a>
        <a href="../index.html">Back to store</a>
      </div>
    </div>
  </main>
</div>

<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const target = safeRedirectTarget(params.get("redirect"), "dashboard.html");
  const notice = document.getElementById("login-notice");
  if (params.get("expired") === "1") { notice.textContent = "Your session has expired. Please sign in again."; notice.hidden = false; }
  if (params.get("denied") === "1") { notice.textContent = "That account doesn't have admin access. Sign in with an administrator account."; notice.hidden = false; }

  // Already signed in as an admin (and not bounced here by the server) → straight in.
  const auth = getAuth();
  if (auth && auth.token && auth.user && auth.user.role === "admin" && !params.has("expired") && !params.has("denied")) {
    window.location.replace(target);
    return;
  }

  document.getElementById("toggle-pw").addEventListener("click", e => {
    const input = document.getElementById("admin-password");
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    e.currentTarget.textContent = show ? "Hide" : "Show";
    e.currentTarget.setAttribute("aria-pressed", String(show));
    e.currentTarget.setAttribute("aria-label", show ? "Hide password" : "Show password");
  });

  document.getElementById("admin-login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("admin-email").value.trim();
    const password = document.getElementById("admin-password").value;
    const msg = document.getElementById("admin-login-msg");
    const btn = e.target.querySelector("button[type=submit]");
    msg.textContent = "";
    if (!email || !password) { msg.textContent = "Enter your email and password."; return; }
    btn.disabled = true;
    btn.textContent = "Signing in…";
    try {
      const user = await loginUser({ email, password });
      if (user.role !== "admin") {
        clearAuth();
        throw new Error("This account doesn't have admin access.");
      }
      window.location.href = target;
    } catch (err) {
      msg.textContent = err.message;
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  });
})();
</script>
</body>
</html>
