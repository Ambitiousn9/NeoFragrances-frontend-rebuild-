<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="images/logo/logo.png" type="image/png">
<title>Forgot Password — NeoFragrances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/password-reset.css">
<link rel="stylesheet" href="css/mobile-drawer.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div id="site-header"></div>
<script src="js/layout.js"></script>
<main id="main">

<div class="auth-wrap">
  <div class="auth-container">
    <a href="index.html" class="auth-back-link"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to store</a>
  <div class="auth-card">
    <h1>Forgot Password?</h1>
    <p class="sub">Enter the email address you used to register your NeoFragrances account, and we'll send you a secure link to reset your password.</p>

    <form id="forgot-form">
      <div class="field">
        <label for="fp-email">Email</label>
        <input type="email" id="fp-email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-pill">Send Reset Link</button>
    </form>

    <div id="fp-result" style="margin-top:20px;" aria-live="polite"></div>

    <p class="auth-switch">Remembered it? <a href="login.html">Back to Login</a></p>
  </div>
  </div>
</div>
</main>

<div id="site-footer"></div>

<script src="js/main.js"></script>
<script src="js/catalog.js"></script>
<script src="js/search-suggest.js"></script>
<script src="js/motion.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/password-reset.js"></script>
<script src="js/mobile-drawer.js"></script>
</body>
</html>
