<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="images/logo/logo.png" type="image/png">
<title>Product Details — NeoFragrances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<div id="site-header"></div>
<script src="js/layout.js"></script>
<main id="main">

<section>
  <div class="container">
    <div class="container" style="padding-top:18px; font-size:13px; color:var(--ink-soft);" id="pd-breadcrumb"></div>
<div id="pd-content" class="pd-layout"></div>

    <section id="reviews-section" style="margin-top:70px; max-width:760px;">
      <h2 class="section-title" style="font-size:26px; margin-bottom:16px;">Customer Reviews</h2>
      <div id="reviews-summary" style="margin-bottom:24px;"></div>
      <div id="reviews-list" style="margin-bottom:36px;"></div>
      <div id="review-form-wrap"></div>
    </section>

    <h2 class="section-title related-title">You May Also Like</h2>
    <div class="product-grid" id="related-grid"></div>
  </div>
</section>

</main>

<div id="site-footer"></div>
<script src="js/main.js"></script>
<script src="js/catalog.js"></script>
<script src="js/search-suggest.js"></script>
<script src="js/motion.js"></script>
<script src="js/toast.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/reviews.js"></script>
<script>
document.getElementById("pd-content").innerHTML =
  `<p style="grid-column:1/-1; color:var(--ink-soft); padding:40px 0;">Loading product...</p>`;

document.addEventListener("productsReady", async (e) => {
  if (!e.detail.success || PRODUCTS.length === 0) {
    document.getElementById("pd-content").innerHTML =
      `<p style="grid-column:1/-1; color:var(--wine); padding:40px 0;">Couldn't load this product — make sure the backend server (node server.js) is running.</p>`;
    return;
  }

  const params = new URLSearchParams(window.location.search);
  // A missing, malformed or unknown id must never quietly show a different fragrance.
  // Only a positive whole number matching a product in the active catalog is accepted;
  // soft-deleted products are not served by /api/products, so their ids arrive here too.
  // Everything else renders the shared not-found state below.
  const rawId = (params.get("id") || "").trim();
  const id = /^\d+$/.test(rawId) ? Number(rawId) : 0;
  const p = id > 0 ? PRODUCTS.find(pr => pr.id === id) : null;
  if (!p) {
    document.title = "Product not found — NeoFragrances";
    document.getElementById("pd-breadcrumb").innerHTML =
      `<a href="index.html" style="color:var(--ink-soft); text-decoration:none;">Home</a> &nbsp;›&nbsp;
       <span style="color:var(--ink);">Product not found</span>`;
    // Same .nf-empty component the shop grid and the bag already use — no new CSS.
    document.getElementById("pd-content").innerHTML = `
      <div class="nf-empty" role="status">
        <i class="fa-regular fa-compass" aria-hidden="true"></i>
        <h2>Product not found</h2>
        <p>This fragrance isn't available — it may have been removed, or the link may be incomplete.</p>
        <div class="nf-empty-actions">
          <a class="btn btn-primary btn-sm nf-btn-pill" href="products.html">Browse all fragrances</a>
          <a class="btn btn-outline btn-sm" href="index.html">Go to homepage</a>
        </div>
      </div>`;
    // Reviews and "You May Also Like" belong to a product that does not exist here.
    for (const sel of ["#reviews-section", ".related-title", "#related-grid"]) {
      const el = document.querySelector(sel);
      if (el) el.style.display = "none";
    }
    return;
  }

  // FIX: check for a currently-active Special Offer on this exact
  // product, using the same public endpoint the Special Offers page
  // already uses — this is what was missing. Without this, "Shop Now"
  // from the offers page always landed here showing (and adding to
  // cart at) the regular price, regardless of any active discount.
  // Uses the shared loader (main.js), so when the product is in several live offers
  // this page shows — and adds to cart at — the same lowest price as the cards and cart.
  await nfLoadActiveOffers();
  const activeOffer = ACTIVE_OFFER_BY_PRODUCT[p.id] || null;

  document.title = `${p.name} — NeoFragrances`;
const concMatch = p.name.match(/\b(EDP|EDT|EDC)\b/i);
  const sizeMatch = p.name.match(/(\d+)\s?ml/i);
  const concentration = concMatch ? { EDP: "Eau de Parfum", EDT: "Eau de Toilette", EDC: "Eau de Cologne" }[concMatch[0].toUpperCase()] : null;
  const size = sizeMatch ? `${sizeMatch[1]}ml` : null;
  const hasRating = p.reviewCount > 0;

  // Prefer the admin's own written description. If it's blank, fall back
  // to the auto-generated one built from notes; if notes are also
  // missing/placeholder, fall back to a generic line.
  const notesComplete = p.notes && p.notes.top && p.notes.middle && p.notes.base
    && p.notes.top !== "—" && p.notes.middle !== "—" && p.notes.base !== "—";
  const pdDescription = p.description && p.description.trim()
    ? p.description
    : notesComplete
      ? `A ${p.category} fragrance built around ${p.notes.middle.toLowerCase()}, opening with ${p.notes.top.toLowerCase()} and settling into a warm base of ${p.notes.base.toLowerCase()}. Long-lasting and instantly recognizable.`
      : `A distinctive ${p.category} fragrance from ${p.brand}, crafted for lasting impact and everyday sophistication.`;

  document.getElementById("pd-breadcrumb").innerHTML =
    `<a href="index.html" style="color:var(--ink-soft); text-decoration:none;">Home</a> &nbsp;›&nbsp;
     <span style="text-transform:capitalize;">${escapeHtml(p.category)}</span> &nbsp;›&nbsp;
     <span style="color:var(--ink);">${escapeHtml(p.name)}</span>`;

  // Reuses the same offer-price-row / offer-price-original /
  // offer-save-badge classes as the Special Offers page and the cart —
  // one consistent look, no new CSS.
  const priceRowHTML = activeOffer
    ? `
      <div class="pd-price-stock-row">
        <div>
          <div class="offer-price-row" style="margin-bottom:4px;">
            <span class="offer-price-original">${money(activeOffer.original_price)}</span>
            <span class="offer-save-badge">SAVE ${escapeHtml(activeOffer.discount_percent)}%</span>
          </div>
          <div class="pd-price">${money(activeOffer.sale_price)}</div>
        </div>
        <span class="${p.stock ? 'stock-yes' : 'stock-no'}">${p.stock ? 'In Stock' : 'Out of Stock'}</span>
      </div>`
    : `
      <div class="pd-price-stock-row">
        <div class="pd-price">${money(p.price)}</div>
        <span class="${p.stock ? 'stock-yes' : 'stock-no'}">${p.stock ? 'In Stock' : 'Out of Stock'}</span>
      </div>`;

  document.getElementById("pd-content").innerHTML = `
    <div>
      <div class="pd-gallery-main">${productMedia(p.image, p.name)}</div>
      <div class="pd-thumbs">
        <div class="pd-thumb active">${productMedia(p.image, p.name)}</div>
      </div>
    </div>
    <div>
      <span class="pd-brand">${escapeHtml(p.brand)}</span>
      <h1 class="pd-title">${escapeHtml(p.name)}</h1>

      <div class="pd-rating-row">
        ${hasRating
          ? `<span>${starIcons(p.avgRating)}</span><span class="pd-rating-text">${Number(p.avgRating).toFixed(1)} (${escapeHtml(p.reviewCount)} Review${p.reviewCount !== 1 ? "s" : ""})</span>`
          : `<span class="pd-rating-text">No reviews yet</span>`}
      </div>

      ${priceRowHTML}

      <p class="pd-desc">${escapeHtml(pdDescription)}</p>

      <div class="pd-qty-label">Quantity</div>
      <div class="qty-control">
        <button id="qty-minus">−</button>
        <span id="qty-value">1</span>
        <button id="qty-plus">+</button>
      </div>

            <div class="pd-cta-row">
        <button class="btn btn-primary pd-add-to-cart-btn" id="pd-add-cart" ${p.stock ? "" : "disabled"}><i class="fa-solid fa-bag-shopping"></i>&nbsp; Add to Cart</button>
        <button class="wishlist-btn pd-wishlist-btn" data-id="${escapeHtml(p.id)}" onclick="toggleWishlist(${Number(p.id)}, this)" title="Save to wishlist"><i class="fa-regular fa-heart"></i></button>
        <button class="wishlist-btn pd-wishlist-btn" id="pd-share-btn" title="Share this fragrance">
          <svg width="15" height="15" viewBox="0 0 448 512" fill="currentColor"><path d="M352 224c53 0 96-43 96-96s-43-96-96-96s-96 43-96 96c0 4 .2 8 .7 11.9l-94.1 47C145.4 170.2 121.9 160 96 160c-53 0-96 43-96 96s43 96 96 96c25.9 0 49.4-10.2 66.6-26.9l94.1 47c-.5 3.9-.7 7.8-.7 11.9c0 53 43 96 96 96s96-43 96-96s-43-96-96-96c-25.9 0-49.4 10.2-66.6 26.9l-94.1-47c.5-3.9 .7-7.8 .7-11.9s-.2-8-.7-11.9l94.1-47C302.6 213.8 326.1 224 352 224z"/></svg>
        </button>
      </div>


      <div class="pd-trust-row">
        <span><i class="fa-solid fa-lock"></i>Secure Paystack checkout</span>
        <span><i class="fa-solid fa-location-crosshairs"></i>Order tracking</span>
        <span><i class="fa-brands fa-whatsapp"></i>Direct support</span>
      </div>

      <div class="pd-tabs">
        <div class="pd-tab-buttons">
          <button class="pd-tab-btn active" data-tab="details">Fragrance Details</button>
          <button class="pd-tab-btn" data-tab="notes">Fragrance Notes</button>
          <button class="pd-tab-btn" data-tab="shipping">Shipping & Returns</button>
        </div>
        <div class="pd-tab-panel active" id="tab-details">
          <div class="pd-details-grid">
            <div><i class="fa-solid fa-venus-mars"></i><div><strong>Gender</strong><span>${escapeHtml(capitalize(p.category))}</span></div></div>
            ${concentration ? `<div><i class="fa-solid fa-flask"></i><div><strong>Concentration</strong><span>${escapeHtml(concentration)}</span></div></div>` : ""}
            ${size ? `<div><i class="fa-solid fa-bottle-droplet"></i><div><strong>Size</strong><span>${escapeHtml(size)}</span></div></div>` : ""}
          </div>
        </div>
        <div class="pd-tab-panel" id="tab-notes">
          ${notesComplete ? `
          <div class="pd-notes-grid">
            <div class="pd-note-card"><i class="fa-solid fa-lemon"></i><h5>Top Notes</h5><p>${escapeHtml(p.notes.top)}</p></div>
            <div class="pd-note-card"><i class="fa-solid fa-gem"></i><h5>Heart Notes</h5><p>${escapeHtml(p.notes.middle)}</p></div>
            <div class="pd-note-card"><i class="fa-solid fa-tree"></i><h5>Base Notes</h5><p>${escapeHtml(p.notes.base)}</p></div>
          </div>
          ` : `<p style="color:var(--ink-soft); font-size:14px;">Fragrance notes haven't been added for this product yet.</p>`}
        </div>
        <div class="pd-tab-panel" id="tab-shipping">
          <p style="color:var(--ink-soft); font-size:14px; line-height:1.7;">Our shipping and returns policies are being finalised. If you have any questions about delivery or returns for this fragrance, please <a href="contact.html" style="color:var(--wine); font-weight:600;">contact us</a> before ordering.</p>
        </div>
      </div>
    </div>
  `;

  document.querySelectorAll(".pd-tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".pd-tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".pd-tab-panel").forEach(panel => panel.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
    });
  });

    document.getElementById("sticky-price").textContent = money(activeOffer ? activeOffer.sale_price : p.price);
  document.getElementById("sticky-add-cart").disabled = !p.stock;
  document.getElementById("sticky-add-cart").addEventListener("click", () => {
    if (!addToCart(p.id, qty, activeOffer ? activeOffer.id : null)) {
      if (typeof showToast === "function") showToast(CART_SAVE_ERROR, "error");
      return;
    }
    showAddedState(document.getElementById("sticky-add-cart"), `<i class="fa-solid fa-bag-shopping"></i>&nbsp; Add to Cart`);
    if (typeof showToast === "function") showToast("Added to cart");
  });
  window.addEventListener("scroll", () => {
    const ctaRow = document.querySelector(".pd-cta-row");
    const bar = document.getElementById("pd-sticky-bar");
    if (!ctaRow || !bar) return;
    bar.classList.toggle("show", ctaRow.getBoundingClientRect().bottom < 0);
  });

  let qty = 1;
  document.getElementById("qty-plus").addEventListener("click", () => {
    qty++; document.getElementById("qty-value").textContent = qty;
  });
  document.getElementById("qty-minus").addEventListener("click", () => {
    qty = Math.max(1, qty - 1); document.getElementById("qty-value").textContent = qty;
  });
    document.getElementById("pd-add-cart").addEventListener("click", (e) => {
  if (!addToCart(p.id, qty, activeOffer ? activeOffer.id : null)) {
    if (typeof showToast === "function") showToast(CART_SAVE_ERROR, "error");
    return;
  }
  // currentTarget: the button itself, even when the click landed on its icon.
  showAddedState(e.currentTarget, `<i class="fa-solid fa-bag-shopping"></i>&nbsp; Add to Cart`);
  if (typeof showToast === "function") showToast("Added to cart");
});

  document.getElementById("pd-share-btn").addEventListener("click", async () => {
    const shareData = {
      title: `${p.name} — NeoFragrances`,
      text: `Check out ${p.name} by ${p.brand} on NeoFragrances`,
      url: window.location.href,
    };
    if (navigator.share) {
      try { await navigator.share(shareData); } catch (err) { /* user cancelled — no action needed */ }
    } else {
      try {
        await navigator.clipboard.writeText(window.location.href);
        if (typeof showToast === "function") showToast("Link copied to clipboard");
      } catch (err) {
        if (typeof showToast === "function") showToast("Couldn't copy link", "error");
      }
    }
  });


  const related = PRODUCTS.filter(pr => pr.category === p.category && pr.id !== p.id).slice(0, 4);
  document.getElementById("related-grid").innerHTML = related.map(productCard).join("");
  if (typeof refreshWishlistIcons === "function") refreshWishlistIcons();
  if (typeof initReviews === "function") initReviews(p.id);
});
</script>
    <link rel="stylesheet" href="css/mobile-drawer.css">
<script src="js/mobile-drawer.js"></script>
<div class="pd-sticky-bar" id="pd-sticky-bar">
  <span id="sticky-price"></span>
  <button class="btn btn-primary" id="sticky-add-cart"><i class="fa-solid fa-bag-shopping"></i>&nbsp; Add to Cart</button>
</div>
</body>
</html>
