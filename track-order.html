<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="images/logo/logo.png" type="image/png">
<title>Track Your Order — NeoFragrances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/mobile-drawer.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/account.css">
</head>
<body class="nf-account-page">

<div id="site-header"></div>
<script src="js/layout.js"></script>
<main id="main">

  <section class="nf-account-head">
    <div class="container">
      <nav class="nf-breadcrumb" aria-label="Breadcrumb">
        <ol><li><a href="index.html">Home</a></li><li aria-current="page">Track an order</li></ol>
      </nav>
      <h1>Track an order</h1>
      <p class="nf-account-greeting">Enter your order number and the email address you used at checkout.</p>
    </div>
  </section>

  <div class="container nf-track">
    <div class="nf-track-grid">
      <form id="track-order-form" class="nf-acc-form nf-track-form" novalidate>
        <div class="nf-form-grid nf-form-grid--narrow">
          <div class="nf-field">
            <label for="track-order-id">Order number</label>
            <input type="text" id="track-order-id" inputmode="numeric" autocomplete="off" placeholder="e.g. 47" required aria-describedby="track-order-id-error">
            <p class="nf-form-status is-error" id="track-order-id-error" hidden></p>
          </div>
          <div class="nf-field">
            <label for="track-order-email">Email address</label>
            <input type="email" id="track-order-email" autocomplete="email" placeholder="Email used at checkout" required aria-describedby="track-order-email-error">
            <p class="nf-form-status is-error" id="track-order-email-error" hidden></p>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Track order</button>
        <p class="nf-acc-note" id="track-signed-in-note" hidden>Signed in? All your orders are under <a href="my-account.html#orders">My account → Orders</a>.</p>
      </form>

      <div id="track-order-result" class="nf-track-result" aria-live="polite"></div>
    </div>
  </div>

</main>

<div id="site-footer"></div>

<script src="js/main.js"></script>
<script src="js/catalog.js"></script>
<script src="js/search-suggest.js"></script>
<script src="js/motion.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders-common.js"></script>
<script src="js/track-order.js"></script>
<script src="js/mobile-drawer.js"></script>
</body>
</html>
