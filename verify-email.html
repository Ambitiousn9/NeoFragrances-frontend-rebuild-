<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="images/logo/logo.png" type="image/png">
<title>Verify Your Email — NeoFragrances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/mobile-drawer.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div id="site-header"></div>
<script src="js/layout.js"></script>
<main id="main">

<div class="auth-wrap">
  <div class="auth-container">
    <a href="index.html" class="auth-back-link"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to store</a>
    <div class="auth-card" style="text-align:center;">

      <div id="verify-state-loading" role="status">
        <i class="fa-solid fa-spinner fa-spin auth-state-icon auth-state-icon--muted" aria-hidden="true"></i>
        <h1 style="margin-top:18px;">Verifying your email...</h1>
        <p class="sub">Just a moment.</p>
      </div>

      <div id="verify-state-success" style="display:none;">
        <i class="fa-solid fa-circle-check auth-state-icon auth-state-icon--success" aria-hidden="true"></i>
        <h1 style="margin-top:18px;">Email Verified!</h1>
        <p class="sub">Your address is confirmed — you can sign in now.</p>
        <a href="login.html" class="btn btn-primary btn-block btn-pill" style="margin-top:22px; display:inline-block;">Go to Sign In</a>
      </div>

      <div id="verify-state-error" style="display:none;">
        <i class="fa-solid fa-circle-exclamation auth-state-icon auth-state-icon--error" aria-hidden="true"></i>
        <h1 style="margin-top:18px;">Link Invalid or Expired</h1>
        <p class="sub" id="verify-error-message">This verification link is invalid or has expired. Please request a new one.</p>

        <div class="field" style="text-align:left; margin-top:20px;">
          <label for="resend-email">Email address</label>
          <input type="email" id="resend-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <button type="button" id="resend-btn" class="btn btn-primary btn-block btn-pill" style="margin-top:10px;">
          Send a New Link
        </button>
        <p id="resend-msg" class="auth-resend-msg" aria-live="polite"></p>

        <p class="auth-switch-prominent" style="margin-top:18px;">
          Already verified? <a href="login.html">Sign in</a>
        </p>
      </div>

    </div>
  </div>
</div>

</main>

<div id="site-footer"></div>

<script src="js/main.js"></script>
<script src="js/catalog.js"></script>
<script src="js/search-suggest.js"></script>
<script src="js/motion.js"></script>
<script src="js/toast.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/mobile-drawer.js"></script>
<script>
  (async function verifyEmailOnLoad() {
    const loadingEl = document.getElementById("verify-state-loading");
    const successEl = document.getElementById("verify-state-success");
    const errorEl = document.getElementById("verify-state-error");
    const errorMsgEl = document.getElementById("verify-error-message");

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    function showError(message) {
      loadingEl.style.display = "none";
      successEl.style.display = "none";
      errorEl.style.display = "block";
      if (message) errorMsgEl.textContent = message;
    }

    if (!token) {
      showError("This verification link is missing its token. Please request a new one below.");
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/verify-email?token=${encodeURIComponent(token)}`);
      const data = await res.json();

      if (!res.ok || !data.success) {
        showError(data.error);
        return;
      }

      loadingEl.style.display = "none";
      successEl.style.display = "block";
    } catch (err) {
      showError("Something went wrong verifying your email. Please try again.");
    }
  })();

  document.getElementById("resend-btn").addEventListener("click", async () => {
    const emailInput = document.getElementById("resend-email");
    const msgEl = document.getElementById("resend-msg");
    const btn = document.getElementById("resend-btn");
    const email = emailInput.value.trim();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      msgEl.style.color = "#A3273F";
      msgEl.textContent = "Enter a valid email address.";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Sending...";
    try {
      const message = await resendVerificationEmail(email);
      msgEl.style.color = "#22733B";
      msgEl.textContent = message;
      btn.textContent = "Send a New Link";
    } catch (err) {
      msgEl.style.color = "#A3273F";
      msgEl.textContent = err.message || "Could not resend verification email.";
      btn.disabled = false;
      btn.textContent = "Send a New Link";
    }
  });
</script>
</body>
</html>
